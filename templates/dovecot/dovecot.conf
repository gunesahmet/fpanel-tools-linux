ssl = no
disable_plaintext_auth = no

first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000

mail_uid = 5000
mail_gid = 5000

# Maildir
mail_location = maildir:/usr/local/fpanel/mail/domains/%d/%n/Maildir
# maildir_broken_filename_sizes = yes
dotlock_use_excl = no
mail_fsync = always

# Protocol
protocols = pop3 imap
protocol imap {
        imap_client_workarounds = delay-newmail
        mail_plugins = quota imap_quota
}
protocol pop3 {
        mail_plugins = quota
        pop3_client_workarounds = outlook-no-nuls oe-ns-eoh
}
protocol lda {
        postmaster_address = postmaster@HOSTNAME
        quota_full_tempfail = yes
        rejection_subject = Automatically rejected mail from PostMaster
        rejection_reason =  Your message to <%t> was automatically rejected:%n%r
        mail_plugins = quota
}
# Stats Service
service stats {
    unix_listener stats-reader {
        user = vmail
        group = vmail
        mode = 0660
    }

    unix_listener stats-writer {
        user = vmail
        group = vmail
        mode = 0660
    }
}

# Authentication Service
auth_mechanisms = plain login
service auth {
        unix_listener /usr/local/fpanel/mail/var/spool/private/auth {
                mode = 0660
                user = postfix
                group = postfix
        }
        unix_listener auth-master {
                mode = 0600
        }
        unix_listener auth-userdb {
                user = vmail
                mode = 0600
        }
}

userdb {
  args = /etc/dovecot/dovecot-auth.conf
  driver = sql
}
passdb {
  args = /etc/dovecot/dovecot-auth.conf
  driver = sql
}
