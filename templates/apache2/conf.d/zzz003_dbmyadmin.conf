# FPanel - Dont edit this file.
<VirtualHost *:80>
	ServerName dbmyadmin.#HOSTNAME#:80
	ServerAlias *dbmyadmin.*
	RMode config
	RUidGid www-data nogroup
	RGroups nogroup	

	UseCanonicalName Off
	DocumentRoot /var/www/dbmyadmin/
	CustomLog  /var/log/apache2/access_log combined
	ErrorLog  /var/log/apache2/error_log

	<Directory /var/www/dbmyadmin>
		<IfModule mod_php5.c>
			php_admin_flag engine on
			php_value suhosin.session.encrypt Off
		</IfModule>
		Options -Includes +ExecCGI
	</Directory>
</VirtualHost>

Alias /dbmyadmin /var/www/dbmyadmin
